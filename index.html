<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
    <script src="script.js" defer></script>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav">
      <ul>
        <li>
          <div id="city">Noida</div>
        </li>
        <li>
          <ul>
            <li>
              <div id="temperature">45 C</div>
            </li>
            <li>
              <div id="stopwatch">Stopwatch</div>
            </li>
            <li>
              <div id="alarm">Alarm</div>
            </li>
          </ul>
        </li>
      </ul>

      </div>
    </div>
